[package]
name = "npo_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["enable-interning"] }

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

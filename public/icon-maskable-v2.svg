<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>PW Notes Print Optimizer icon</title>
  <desc>Full-bleed gradient icon with a white paper sheet and checkmark badge, safe for adaptive icon masks.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="900" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#243BFF"/>
      <stop offset="45%" stop-color="#5B35FF"/>
      <stop offset="100%" stop-color="#A12CFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="250" y1="250" x2="770" y2="780">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDEFFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="760" cy="230" r="230" fill="#FFFFFF" opacity="0.12" filter="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#shine)"/>
  <g transform="translate(512 512) scale(0.85) translate(-503 -538)">
    <g filter="url(#shadow)">
      <path d="M300 222 H650 L770 342 V790 C770 826 741 854 705 854 H300 C264 854 236 826 236 790 V286 C236 250 264 222 300 222 Z" fill="url(#paper)"/>
      <path d="M650 222 V314 C650 334 666 350 686 350 H770 Z" fill="#D9DEFF"/>
      <path d="M650 222 L770 342 H688 C667 342 650 325 650 304 Z" fill="#FFFFFF" opacity="0.85"/>
    </g>
    <rect x="330" y="420" width="330" height="30" rx="15" fill="#5B35FF" opacity="0.90"/>
    <rect x="330" y="490" width="260" height="30" rx="15" fill="#7A68FF" opacity="0.75"/>
    <rect x="330" y="560" width="300" height="30" rx="15" fill="#9A8CFF" opacity="0.58"/>
    <g transform="translate(430 635)">
      <circle cx="82" cy="82" r="82" fill="#5B35FF"/>
      <path d="M48 88 L70 110 L118 54" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <path d="M0 110 C220 10 520 40 1024 230 V0 H0 Z" fill="#FFFFFF" opacity="0.09"/>
